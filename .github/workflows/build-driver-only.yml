name: Build Driver Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build directory
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

      - name: Compile kernel driver source
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          $src = Join-Path $repoRoot 'driver.c'
          $obj = Join-Path $buildDir 'GmuxDriver.obj'

          if (-not (Test-Path $src)) { throw "driver.c not found at $src" }

          $includeRoots = @(
            $repoRoot,
            'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km',
            'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\shared',
            'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um'
          )

          $includeArgs = $includeRoots | ForEach-Object { '/I"' + $_ + '"' }
          $cmd = @('cl','/c','/nologo','/TC','/DWIN32','/D_WINDOWS','/D_KERNEL_MODE','/D_MBCS','/D_UNICODE','/EHsc','/W3','/Zi') + $includeArgs + @('/Fo"' + $obj + '"', '"' + $src + '"')
          & $cmd[0] $cmd[1..($cmd.Length - 1)]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy INF file
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Copy-Item "$repoRoot\gmux.inf" "$buildDir\gmux.inf" -Force

      - name: List generated files
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Write-Output 'Generated files:'
          Get-ChildItem -Path $buildDir -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmux-driver-artifacts
          path: |
            build/*.obj
            build/*.sys
            build/*.inf
