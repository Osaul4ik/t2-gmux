name: Build Driver Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build directory
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

      - name: Compile kernel driver source
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          $src = Join-Path $repoRoot 'driver.c'
          $obj = Join-Path $buildDir 'GmuxDriver.obj'
          $sys = Join-Path $buildDir 'GmuxDriver.sys'

          if (-not (Test-Path $src)) { throw "driver.c not found at $src" }

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $kmInclude = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'km') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'km' }
          $sharedInclude = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'shared') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'shared' }

          $wdfHeader = Get-ChildItem -Path (Join-Path $sdkRoot 'wdf') -Filter wdf.h -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'kmdf' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($wdfHeader) {
            $wdfInclude = $wdfHeader.DirectoryName
          } else {
            $wdfInclude = $null
          }

          if (-not $kmInclude -or -not $sharedInclude) {
            throw 'Required Windows SDK include directories were not found.'
          }

          # Compile with kernel-mode flags
          $args = @(
            '/c', '/nologo', '/TC',
            '/DWIN32', '/D_WINDOWS', '/D_KERNEL_MODE', '/D_MBCS', '/D_UNICODE',
            '/D_AMD64_', '/DAMD64', '/D_X64_', '/D_WIN64',
            '/W3', '/Zi',
            '/GS-',  # Disable security cookies
            '/Gz',   # __stdcall calling convention
            '/Zl',   # Remove default library names from .obj
            "/I$repoRoot",
            "/I$kmInclude",
            "/I$sharedInclude"
          )
          if ($wdfInclude) { $args += "/I$wdfInclude" }
          $args += @("/Fo$obj", "/Tc$src")

          Write-Host "cl $($args -join ' ')"
          & cl @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (Test-Path $obj) {
            $sdkLibRoot = 'C:\Program Files (x86)\Windows Kits\10\Lib'
            $libRoots = @()
            $selectedLibs = @()

            # Find the appropriate SDK version for x64
            $sdkVersion = Get-ChildItem -Path $sdkLibRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if (-not $sdkVersion) {
              throw 'Windows SDK version directory not found'
            }

            Write-Host "Using SDK version: $($sdkVersion.Name)"

            # Add kernel library paths
            $kernelLibPath = "$sdkLibRoot\$($sdkVersion.Name)\km\x64"
            if (Test-Path $kernelLibPath) {
              $libRoots += $kernelLibPath
              Write-Host "Added kernel library path: $kernelLibPath"
            }

            # Try to find WDF libraries
            $wdfPaths = @(
              "$sdkLibRoot\wdf\kmdf\x64",
              "$sdkLibRoot\wdf\kmdf"
            )

            $wdfFound = $false
            foreach ($wdfPath in $wdfPaths) {
              if (Test-Path $wdfPath) {
                Write-Host "Checking WDF path: $wdfPath"
                $wdfLdr = Get-ChildItem -Path $wdfPath -Filter 'WdfLdr.lib' -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'x64|amd64' -or $_.DirectoryName -match 'x64|amd64' } |
                  Select-Object -First 1
                
                if ($wdfLdr) {
                  Write-Host "Found WdfLdr.lib at $($wdfLdr.FullName)"
                  $selectedLibs += $wdfLdr.FullName
                  $libRoots += $wdfLdr.DirectoryName
                  $wdfFound = $true
                  
                  $wdfDriverEntry = Get-ChildItem -Path $wdfLdr.DirectoryName -Filter 'WdfDriverEntry.lib' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
                  if ($wdfDriverEntry) {
                    Write-Host "Found WdfDriverEntry.lib at $($wdfDriverEntry.FullName)"
                    $selectedLibs += $wdfDriverEntry.FullName
                  }
                  break
                }
              }
            }

            # If WDF libraries not found, try alternative
            if (-not $wdfFound) {
              Write-Host "Searching for WDF libraries in all locations..."
              $wdfLdr = Get-ChildItem -Path $sdkLibRoot -Filter 'WdfLdr.lib' -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64|amd64' -or $_.DirectoryName -match 'x64|amd64' } |
                Select-Object -First 1
              
              if ($wdfLdr) {
                Write-Host "Found WdfLdr.lib at $($wdfLdr.FullName) (fallback)"
                $selectedLibs += $wdfLdr.FullName
                $libRoots += $wdfLdr.DirectoryName
                
                $wdfDriverEntry = Get-ChildItem -Path $wdfLdr.DirectoryName -Filter 'WdfDriverEntry.lib' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
                if ($wdfDriverEntry) {
                  Write-Host "Found WdfDriverEntry.lib at $($wdfDriverEntry.FullName)"
                  $selectedLibs += $wdfDriverEntry.FullName
                }
              }
            }

            # Add standard kernel libraries
            $kernelLibs = @('ntoskrnl.lib', 'hal.lib')
            foreach ($name in $kernelLibs) {
              $match = Get-ChildItem -Path $kernelLibPath -Filter $name -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($match) {
                $selectedLibs += $match.FullName
                Write-Host "Found $name at $($match.FullName)"
              }
            }

            # Remove duplicates
            $libRoots = $libRoots | Select-Object -Unique | Where-Object { Test-Path $_ }
            $selectedLibs = $selectedLibs | Select-Object -Unique

            # Build linker arguments - explicitly avoid MSVC runtime
            $libArgs = $libRoots | ForEach-Object { '/LIBPATH:"' + $_ + '"' }

            Write-Host "Discovered linker libraries: $($selectedLibs -join ', ')"
            Write-Host "Library paths: $($libRoots -join ', ')"
            
            # Linker flags for kernel driver
            $linkArgs = @(
              '/NOLOGO',
              '/DRIVER',
              '/SUBSYSTEM:NATIVE',
              '/ENTRY:DriverEntry',
              "/OUT:$sys",
              '/NODEFAULTLIB',  # Don't link default libraries
              '/IGNORE:4086',   # Ignore /BASE warning for drivers
              '/IGNORE:4254',   # Ignore section alignment warning
              '/MERGE:_PAGE=PAGE',
              '/MERGE:_TEXT=.text',
              '/SECTION:INIT,d'
            ) + $libArgs + @($obj) + $selectedLibs

            Write-Host "link $($linkArgs -join ' ')"
            & link @linkArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy INF file
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          if (Test-Path "$repoRoot\gmux.inf") {
            Copy-Item "$repoRoot\gmux.inf" "$buildDir\gmux.inf" -Force
            Write-Host "Copied gmux.inf to build directory"
          } else {
            Write-Host "Warning: gmux.inf not found in repository root"
          }

      - name: List generated files
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Write-Output 'Generated files:'
          if (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName }
          } else {
            Write-Output 'Build directory not found'
          }

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmux-driver-artifacts
          path: |
            build/*.sys
            build/*.inf