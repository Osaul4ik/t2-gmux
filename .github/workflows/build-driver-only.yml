name: Build Driver Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WDK and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @('Microsoft.WindowsSDK.10.0', 'Microsoft.WindowsWDK.10.0')
          foreach ($package in $packages) {
            try {
              winget install --id $package --accept-source-agreements --accept-package-agreements --disable-interactivity --silent
            } catch {
              Write-Host "Package install warning for ${package}: $($_.Exception.Message)"
            }
          }

      - name: Prepare build directory
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

      - name: Compile kernel driver source
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          $src = Join-Path $repoRoot 'driver.c'
          $obj = Join-Path $buildDir 'GmuxDriver.obj'
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $sdkVersion = Get-ChildItem "$sdkRoot\Include" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $kmInclude = Join-Path $sdkVersion.FullName 'km'
          $sharedInclude = Join-Path $sdkVersion.FullName 'shared'
          $umInclude = Join-Path $sdkVersion.FullName 'um'

          if (-not (Test-Path $src)) { throw "driver.c not found at $src" }
          if (-not (Test-Path $sdkVersion.FullName)) { throw "Windows SDK include directory not found" }

          cl /c /nologo /TC /DWIN32 /D_WINDOWS /D_KERNEL_MODE /D_MBCS /D_UNICODE /EHsc /W3 /Zi /I"$repoRoot" /I"$kmInclude" /I"$sharedInclude" /I"$umInclude" /Fo"$obj" "$src"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy INF file
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Copy-Item "$repoRoot\gmux.inf" "$buildDir\gmux.inf" -Force

      - name: List generated files
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Write-Output 'Generated files:'
          Get-ChildItem -Path $buildDir -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmux-driver-artifacts
          path: |
            build/*.obj
            build/*.sys
            build/*.inf
