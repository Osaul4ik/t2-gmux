name: Build Driver Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build directory
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

      - name: Create stub for security cookie
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $stubPath = Join-Path $repoRoot 'stub.c'
          @'
          // Stub for security cookie functions when /GS- is used
          unsigned __int64 __security_cookie = 0x00002B992DDFA232;

          void __security_init_cookie(void)
          {
              // Nothing needed for kernel mode with /GS-
          }
          '@ | Out-File -FilePath $stubPath -Encoding utf8
          Write-Host "Created stub.c at $stubPath"

      - name: Compile kernel driver source
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          $src = Join-Path $repoRoot 'driver.c'
          $stubSrc = Join-Path $repoRoot 'stub.c'
          $obj = Join-Path $buildDir 'GmuxDriver.obj'
          $stubObj = Join-Path $buildDir 'stub.obj'
          $sys = Join-Path $buildDir 'GmuxDriver.sys'

          if (-not (Test-Path $src)) { throw "driver.c not found at $src" }

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $kmInclude = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'km') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'km' }
          $sharedInclude = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'shared') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'shared' }

          $wdfHeader = Get-ChildItem -Path (Join-Path $sdkRoot 'wdf') -Filter wdf.h -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'kmdf' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($wdfHeader) {
            $wdfInclude = $wdfHeader.DirectoryName
          } else {
            $wdfInclude = $null
          }

          if (-not $kmInclude -or -not $sharedInclude) {
            throw 'Required Windows SDK include directories were not found.'
          }

          # Compile driver.c
          $commonArgs = @(
            '/c', '/nologo', '/TC',
            '/DWIN32', '/D_WINDOWS', '/D_KERNEL_MODE', '/D_MBCS', '/D_UNICODE',
            '/D_AMD64_', '/DAMD64', '/D_X64_', '/D_WIN64',
            '/W3', '/Zi',
            '/GS-',  # Disable security cookies
            '/Gz',   # __stdcall
            '/Zl',   # Omit default library names
            "/I$repoRoot",
            "/I$kmInclude",
            "/I$sharedInclude"
          )
          if ($wdfInclude) { $commonArgs += "/I$wdfInclude" }

          $driverArgs = $commonArgs + @("/Fo$obj", "/Tc$src")
          Write-Host "cl $($driverArgs -join ' ')"
          & cl @driverArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Compile stub.c (no includes needed)
          $stubArgs = @('/c', '/nologo', '/TC', '/GS-', '/Zl', "/Fo$stubObj", "/Tc$stubSrc")
          Write-Host "cl $($stubArgs -join ' ')"
          & cl @stubArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ((Test-Path $obj) -and (Test-Path $stubObj)) {
            $sdkLibRoot = 'C:\Program Files (x86)\Windows Kits\10\Lib'
            $libRoots = @()
            $selectedLibs = @()

            # Find the appropriate SDK version
            $sdkVersion = Get-ChildItem -Path $sdkLibRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if (-not $sdkVersion) {
              throw 'Windows SDK version directory not found'
            }

            Write-Host "Using SDK version: $($sdkVersion.Name)"

            $kernelLibPath = "$sdkLibRoot\$($sdkVersion.Name)\km\x64"
            if (Test-Path $kernelLibPath) {
              $libRoots += $kernelLibPath
              Write-Host "Added kernel library path: $kernelLibPath"
            }

            # Find WDF libraries
            $wdfPaths = @(
              "$sdkLibRoot\wdf\kmdf\x64",
              "$sdkLibRoot\wdf\kmdf"
            )

            $wdfFound = $false
            foreach ($wdfPath in $wdfPaths) {
              if (Test-Path $wdfPath) {
                Write-Host "Checking WDF path: $wdfPath"
                $wdfLdr = Get-ChildItem -Path $wdfPath -Filter 'WdfLdr.lib' -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'x64|amd64' -or $_.DirectoryName -match 'x64|amd64' } |
                  Select-Object -First 1
                
                if ($wdfLdr) {
                  Write-Host "Found WdfLdr.lib at $($wdfLdr.FullName)"
                  $selectedLibs += $wdfLdr.FullName
                  $libRoots += $wdfLdr.DirectoryName
                  $wdfFound = $true
                  
                  $wdfDriverEntry = Get-ChildItem -Path $wdfLdr.DirectoryName -Filter 'WdfDriverEntry.lib' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
                  if ($wdfDriverEntry) {
                    Write-Host "Found WdfDriverEntry.lib at $($wdfDriverEntry.FullName)"
                    $selectedLibs += $wdfDriverEntry.FullName
                  }
                  break
                }
              }
            }

            # Fallback search
            if (-not $wdfFound) {
              Write-Host "Searching for WDF libraries in all locations..."
              $wdfLdr = Get-ChildItem -Path $sdkLibRoot -Filter 'WdfLdr.lib' -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64|amd64' -or $_.DirectoryName -match 'x64|amd64' } |
                Select-Object -First 1
              
              if ($wdfLdr) {
                Write-Host "Found WdfLdr.lib at $($wdfLdr.FullName) (fallback)"
                $selectedLibs += $wdfLdr.FullName
                $libRoots += $wdfLdr.DirectoryName
                
                $wdfDriverEntry = Get-ChildItem -Path $wdfLdr.DirectoryName -Filter 'WdfDriverEntry.lib' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
                if ($wdfDriverEntry) {
                  Write-Host "Found WdfDriverEntry.lib at $($wdfDriverEntry.FullName)"
                  $selectedLibs += $wdfDriverEntry.FullName
                }
              }
            }

            # Add kernel libraries
            $kernelLibs = @('ntoskrnl.lib', 'hal.lib')
            foreach ($name in $kernelLibs) {
              $match = Get-ChildItem -Path $kernelLibPath -Filter $name -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($match) {
                $selectedLibs += $match.FullName
                Write-Host "Found $name at $($match.FullName)"
              }
            }

            # Remove duplicates
            $libRoots = $libRoots | Select-Object -Unique | Where-Object { Test-Path $_ }
            $selectedLibs = $selectedLibs | Select-Object -Unique

            $libArgs = $libRoots | ForEach-Object { '/LIBPATH:"' + $_ + '"' }

            Write-Host "Discovered linker libraries: $($selectedLibs -join ', ')"
            Write-Host "Library paths: $($libRoots -join ', ')"
            
            $linkArgs = @(
              '/NOLOGO',
              '/DRIVER',
              '/SUBSYSTEM:NATIVE',
              '/ENTRY:DriverEntry',
              "/OUT:$sys",
              '/NODEFAULTLIB',
              '/IGNORE:4086',
              '/IGNORE:4254',
              '/MERGE:_PAGE=PAGE',
              '/MERGE:_TEXT=.text'
            ) + $libArgs + @($obj, $stubObj) + $selectedLibs

            Write-Host "link $($linkArgs -join ' ')"
            & link @linkArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy INF file
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          if (Test-Path "$repoRoot\gmux.inf") {
            Copy-Item "$repoRoot\gmux.inf" "$buildDir\gmux.inf" -Force
            Write-Host "Copied gmux.inf to build directory"
          } else {
            Write-Host "Warning: gmux.inf not found in repository root"
          }

      - name: Install WDK via NuGet (for inf2cat)
        shell: pwsh
        run: |
          Write-Host "Installing WDK NuGet package..."
          $wdkVersion = "10.0.26100.1"
          nuget install Microsoft.Windows.WDK.x64 -Version $wdkVersion -OutputDirectory "$env:USERPROFILE\wdk"
          if ($LASTEXITCODE -ne 0) { throw "NuGet install failed" }
          # Додаємо шлях до інструментів
          $wdkPath = "$env:USERPROFILE\wdk\Microsoft.Windows.WDK.x64.$wdkVersion\tools\x64"
          if (Test-Path $wdkPath) {
            $env:Path += ";$wdkPath"
            Write-Host "Added WDK tools path: $wdkPath"
          } else {
            Write-Host "Warning: WDK tools path not found at $wdkPath, trying alternative location..."
            $wdkPath = Get-ChildItem -Path "$env:USERPROFILE\wdk" -Directory | Where-Object { $_.Name -match "Microsoft.Windows.WDK" } | Select-Object -First 1
            if ($wdkPath) {
              $toolsPath = Join-Path $wdkPath.FullName "tools\x64"
              if (Test-Path $toolsPath) {
                $env:Path += ";$toolsPath"
                Write-Host "Added WDK tools path: $toolsPath"
              }
            }
          }

      - name: Sign driver with test certificate (including CAT)
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          $sys = Join-Path $buildDir 'GmuxDriver.sys'
          $inf = Join-Path $buildDir 'gmux.inf'
          $cat = Join-Path $buildDir 'GmuxDriver.cat'

          if (-not (Test-Path $sys)) { throw "Driver .sys not found at $sys" }
          if (-not (Test-Path $inf)) { throw "INF file not found at $inf" }

          $certName = "TestGmuxDriverCert"
          $cert = Get-ChildItem -Path Cert:\CurrentUser\My | Where-Object { $_.Subject -like "*$certName*" } | Select-Object -First 1
          if (-not $cert) {
            Write-Host "Creating test certificate using New-SelfSignedCertificate..."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$certName" -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048
            if (-not $cert) { throw "Failed to create certificate" }
            $certPath = "$env:TEMP\$certName.cer"
            $cert | Export-Certificate -FilePath $certPath -Type CERT
            Write-Host "Certificate exported to $certPath"
          } else {
            Write-Host "Using existing certificate: $($cert.Subject)"
          }

          # Ensure INF has CatalogFile entry (add if missing)
          $infContent = Get-Content $inf
          if ($infContent -notmatch "CatalogFile\s*=") {
            Write-Host "Adding CatalogFile=GmuxDriver.cat to INF [Version] section..."
            $infContent = $infContent -replace "(\[Version\][\r\n]+)", "`$1CatalogFile=GmuxDriver.cat`n"
            Set-Content $inf $infContent
          }

          # Locate inf2cat.exe (should be in PATH from NuGet)
          $inf2catExe = (Get-Command inf2cat.exe -ErrorAction SilentlyContinue).Source
          if (-not $inf2catExe) {
            # Try common locations
            $possiblePaths = @(
              "C:\Program Files (x86)\Windows Kits\10\bin\x64\inf2cat.exe",
              "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\inf2cat.exe"
            )
            foreach ($p in $possiblePaths) {
              if (Test-Path $p) {
                $inf2catExe = $p
                break
              }
            }
          }
          if (-not $inf2catExe) {
            Write-Host "inf2cat.exe not found, searching in WDK directory..."
            $inf2catExe = Get-ChildItem -Path "$env:USERPROFILE\wdk" -Filter inf2cat.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $inf2catExe) { throw "inf2cat.exe not found" }
          Write-Host "Using inf2cat: $inf2catExe"

          # Create catalog file (CAT)
          Write-Host "Creating catalog file using inf2cat..."
          & $inf2catExe /driver:$buildDir /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "inf2cat failed" }

          if (-not (Test-Path $cat)) {
            throw "CAT file not created: $cat"
          }

          # Sign the CAT file
          Write-Host "Signing catalog file..."
          & signtool sign /v /fd SHA256 /a /s My /n "$certName" /t http://timestamp.digicert.com $cat
          if ($LASTEXITCODE -ne 0) { throw "signtool signing CAT failed" }

          Write-Host "Signing .sys file..."
          & signtool sign /v /fd SHA256 /a /s My /n "$certName" /t http://timestamp.digicert.com $sys
          if ($LASTEXITCODE -ne 0) { throw "signtool signing .sys failed" }

          Write-Host "Driver files signed successfully. CAT file created and signed."

          if (Test-Path "$env:TEMP\$certName.cer") {
            Copy-Item "$env:TEMP\$certName.cer" $buildDir -Force
          }

      - name: List generated files
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Write-Output 'Generated files:'
          if (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName }
          } else {
            Write-Output 'Build directory not found'
          }

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmux-driver-artifacts
          path: |
            build/*.sys
            build/*.inf
            build/*.cat
            build/*.cer