name: Build Driver Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build directory
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

      - name: Compile kernel driver source
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          $src = Join-Path $repoRoot 'driver.c'
          $obj = Join-Path $buildDir 'GmuxDriver.obj'
          $sys = Join-Path $buildDir 'GmuxDriver.sys'

          if (-not (Test-Path $src)) { throw "driver.c not found at $src" }

          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $kmInclude = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'km') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'km' }
          $sharedInclude = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'shared') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'shared' }

          $wdfHeader = Get-ChildItem -Path (Join-Path $sdkRoot 'wdf') -Filter wdf.h -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'kmdf' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($wdfHeader) {
            $wdfInclude = $wdfHeader.DirectoryName
          } else {
            $wdfInclude = $null
          }

          if (-not $kmInclude -or -not $sharedInclude) {
            throw 'Required Windows SDK include directories were not found.'
          }

          $args = @(
            '/c', '/nologo', '/TC', '/DWIN32', '/D_WINDOWS', '/D_KERNEL_MODE', '/D_MBCS', '/D_UNICODE',
            '/D_AMD64_', '/DAMD64', '/D_X64_', '/D_WIN64', '/EHsc', '/W3', '/Zi',
            "/I$repoRoot",
            "/I$kmInclude",
            "/I$sharedInclude"
          )
          if ($wdfInclude) { $args += "/I$wdfInclude" }
          $args += @("/Fo$obj", "/Tc$src")

          Write-Host "cl $($args -join ' ')"
          & cl @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (Test-Path $obj) {
            $sdkLibRoot = 'C:\Program Files (x86)\Windows Kits\10\Lib'
            $libRoots = @($sdkLibRoot)
            $selectedLibs = @()

            # Find the appropriate SDK version for x64
            $sdkVersion = Get-ChildItem -Path $sdkLibRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object Name -Descending |
              Select-Object -First 1

            if (-not $sdkVersion) {
              throw 'Windows SDK version directory not found'
            }

            Write-Host "Using SDK version: $($sdkVersion.Name)"

            # Define the architecture-specific paths
            $archPaths = @(
              "$sdkLibRoot\wdf\kmdf\x64",
              "$sdkLibRoot\$($sdkVersion.Name)\km\x64",
              "$sdkLibRoot\$($sdkVersion.Name)\um\x64"
            )

            foreach ($path in $archPaths) {
              if (Test-Path $path) {
                $libRoots += $path
                Write-Host "Added library path: $path"
              }
            }

            # Look for specific libraries in the x64 paths
            foreach ($name in @('wdfldr.sys.lib', 'WdfLdr.lib', 'ntoskrnl.lib', 'hal.lib')) {
              foreach ($path in $archPaths) {
                if (-not (Test-Path $path)) { continue }
                $match = Get-ChildItem -Path $path -Filter $name -ErrorAction SilentlyContinue |
                  Select-Object -First 1
                if ($match) {
                  $selectedLibs += $match.FullName
                  Write-Host "Found $name at $($match.FullName)"
                  break
                }
              }
            }

            # If we still don't have all libraries, try a broader search with architecture filter
            if ($selectedLibs.Count -lt 4) {
              Write-Host "Searching for missing libraries with broader x64 filter..."
              foreach ($name in @('wdfldr.sys.lib', 'WdfLdr.lib', 'ntoskrnl.lib', 'hal.lib')) {
                $match = Get-ChildItem -Path $sdkLibRoot -Filter $name -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\x64\\' } |
                  Select-Object -First 1
                if ($match) {
                  $selectedLibs += $match.FullName
                  $libRoots += $match.DirectoryName
                  Write-Host "Found $name at $($match.FullName) (fallback)"
                }
              }
              $selectedLibs = $selectedLibs | Select-Object -Unique
            }

            # Add bufferoverflowU.lib for memset and other security functions
            $bufferLib = Get-ChildItem -Path $sdkLibRoot -Filter 'bufferoverflowU.lib' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Select-Object -First 1
            if ($bufferLib) {
              $selectedLibs += $bufferLib.FullName
              $libRoots += $bufferLib.DirectoryName
              Write-Host "Found bufferoverflowU.lib at $($bufferLib.FullName)"
            }

            # Add MSVC runtime libraries for x64
            $msvcLibPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\lib\x64'
            if (Test-Path $msvcLibPath) {
              $libRoots += $msvcLibPath
              Write-Host "Added MSVC library path: $msvcLibPath"
            }

            $libArgs = $libRoots | Select-Object -Unique | Where-Object { Test-Path $_ } |
              ForEach-Object { '/LIBPATH:"' + $_ + '"' }

            Write-Host "Discovered linker libraries: $($selectedLibs -join ', ')"
            $linkArgs = @('/NOLOGO', '/DRIVER', '/SUBSYSTEM:NATIVE', '/ENTRY:DriverEntry', "/OUT:$sys") + $libArgs + @($obj) + $selectedLibs
            Write-Host "link $($linkArgs -join ' ')"
            & link @linkArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy INF file
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          if (Test-Path "$repoRoot\gmux.inf") {
            Copy-Item "$repoRoot\gmux.inf" "$buildDir\gmux.inf" -Force
            Write-Host "Copied gmux.inf to build directory"
          } else {
            Write-Host "Warning: gmux.inf not found in repository root"
          }

      - name: List generated files
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Write-Output 'Generated files:'
          if (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Recurse | Sort-Object FullName | ForEach-Object { $_.FullName }
          } else {
            Write-Output 'Build directory not found'
          }

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmux-driver-artifacts
          path: |
            build/*.sys
            build/*.inf