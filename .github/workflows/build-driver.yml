name: Build Windows Kernel Driver

on:
  push:
    branches: []
  pull_request:
    branches: []
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare build directory
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

      - name: Build user-mode app
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Set-Location $repoRoot
          cl /nologo /EHsc /W3 /DUNICODE /D_UNICODE .\gmux.cpp /I. /Fe"$buildDir\gmux_app.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy INF for packaging
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Copy-Item "$repoRoot\gmux.inf" "$buildDir\gmux.inf" -Force

      - name: List build output files
        shell: pwsh
        run: |
          $repoRoot = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          $buildDir = Join-Path $repoRoot 'build'
          Write-Output '=== Repository files ==='
          Get-ChildItem -Path $repoRoot -File | Sort-Object Name | Format-Table -AutoSize
          Write-Output '=== Build directory ==='
          Get-ChildItem -Path $buildDir -Recurse | Sort-Object FullName | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmux-driver-files
          path: |
            build/*.exe
            build/*.dll
            build/*.sys
            build/gmux.inf
